[General]
TcpServerPort=5760

[UartEndpoint pixhawk]
# /dev/pixhawk is a udev symlink, not a raw device path - it works whether the
# Pixhawk is connected via USB (matched by idVendor/idProduct in
# 99-pixhawk.rules) or via a real UART pin (matched by KERNEL name in
# 99-pixhawk-uart.rules). Only one is ever physically connected at a time, so
# only one rule fires, and this line never needs to change based on which.
Device=/dev/pixhawk
# Must match the Pixhawk's own SER_TELx_BAUD parameter exactly when connected
# via real UART (unlike USB-CDC, which effectively ignores this value).
# Confirmed live via a direct baud scan on 2026-09-16: this TELEM port's real
# configured rate is 115200, not 921600 (that assumption came from the old
# USB link, which doesn't actually enforce a baud rate the way real UART does).
Baud=115200

# Primary Real-Time UDP Flight Endpoint (Bidirectional for GCS Laptop over Wi-Fi AP)
[UdpEndpoint gcs_flight]
Mode=server
Address=0.0.0.0
Port=14550

# Local Companion Inter-Process UDP Endpoint (for px4_vision_bridge and obstacle_distance_bridge)
[UdpEndpoint local_companion]
Mode=normal
Address=127.0.0.1
Port=14541
