[General]
TcpServerPort=5760

[UartEndpoint pixhawk]
Device=/dev/ttyACM0
Baud=921600

# Primary Real-Time UDP Flight Endpoint (Bidirectional for GCS Laptop over Wi-Fi AP)
[UdpEndpoint gcs_flight]
Mode=server
Address=0.0.0.0
Port=14550

# Local Companion Inter-Process UDP Endpoint (for px4_vision_bridge and obstacle_distance_bridge)
[UdpEndpoint local_companion]
Mode=normal
Address=127.0.0.1
Port=14541
